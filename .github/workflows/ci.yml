name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Audit · Migraciones · Lint · Typecheck · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finanzas
          POSTGRES_PASSWORD: finanzas
          POSTGRES_DB: finanzas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finanzas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Las high del arbol de la CLI de Prisma (deepmerge-ts) estan
      # documentadas como riesgo aceptado; aqui se bloquea solo lo critico.
      - name: Auditoria de dependencias
        run: npm audit --audit-level=critical

      # Valida el esquema y las migraciones contra un Postgres efimero,
      # exactamente como lo hace prod con `prisma migrate deploy`.
      - name: Aplicar migraciones (smoke test de DB)
        env:
          DATABASE_URL: postgresql://finanzas:finanzas@localhost:5432/finanzas_test
        run: npm run db:migrate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Cache de build de Next.js
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}

      - name: Build
        run: npm run build

      # Levanta el servidor de producción real y comprueba que responde,
      # que las cabeceras de seguridad llegan al cliente y que el bootstrap
      # de admin es atómico (dos registros simultáneos = un único ADMIN).
      - name: Smoke test de servidor de producción
        env:
          AUTH_SECRET: ci-smoke-secret-1234567890123456
          DATABASE_URL: postgresql://finanzas:finanzas@localhost:5432/finanzas_test
        run: |
          npm start -- -p 3100 > /tmp/next-smoke.log 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3100/login; then break; fi
            sleep 1
          done
          HDRS=$(curl -sI http://localhost:3100/login) || { echo "servidor no responde"; cat /tmp/next-smoke.log; kill $SERVER_PID 2>/dev/null; exit 1; }
          echo "$HDRS" | grep -qi "content-security-policy:" || { echo "FALTA Content-Security-Policy"; kill $SERVER_PID 2>/dev/null; exit 1; }
          echo "$HDRS" | grep -qi "x-content-type-options: nosniff" || { echo "FALTA nosniff"; kill $SERVER_PID 2>/dev/null; exit 1; }
          echo "$HDRS" | grep -qi "x-frame-options: DENY" || { echo "FALTA X-Frame-Options"; kill $SERVER_PID 2>/dev/null; exit 1; }

          # Bootstrap ADMIN: dos registros concurrentes sobre DB vacia. Con el
          # fix (aislamiento SERIALIZABLE + reintento) debe existir UN solo
          # ADMIN. Email duplicado debe responder 409.
          curl -s -X POST http://localhost:3100/api/auth/register -H 'content-type: application/json' -d '{"email":"user1@ci.test","password":"Password123","name":"Uno"}' -o /tmp/reg1.json &
          curl -s -X POST http://localhost:3100/api/auth/register -H 'content-type: application/json' -d '{"email":"user2@ci.test","password":"Password123","name":"Dos"}' -o /tmp/reg2.json &
          wait
          DUP_CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3100/api/auth/register -H 'content-type: application/json' -d '{"email":"user1@ci.test","password":"Password123"}')
          [ "$DUP_CODE" = "409" ] || { echo "Email duplicado respondio $DUP_CODE (esperaba 409)"; kill $SERVER_PID 2>/dev/null; exit 1; }
          ADMINS=$(node -e "const{PrismaClient}=require(\"@prisma/client\");const p=new PrismaClient();p.user.count({where:{role:\"ADMIN\"}}).then(c=>{console.log(c);process.exit(c===1?0:1)}).catch(e=>{console.error(e);process.exit(2)})")
          [ "$ADMINS" = "1" ] || { echo "Bootstrap roto: $ADMINS admins (esperaba 1)"; kill $SERVER_PID 2>/dev/null; exit 1; }

          echo "Smoke OK: headers, 409 en duplicado y 1 unico ADMIN en bootstrap"
          kill $SERVER_PID 2>/dev/null || true