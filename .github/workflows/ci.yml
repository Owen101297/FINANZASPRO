name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Audit · Migraciones · Lint · Typecheck · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finanzas
          POSTGRES_PASSWORD: finanzas
          POSTGRES_DB: finanzas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finanzas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Las high del arbol de la CLI de Prisma (deepmerge-ts) estan
      # documentadas como riesgo aceptado; aqui se bloquea solo lo critico.
      - name: Auditoria de dependencias
        run: npm audit --audit-level=critical

      # Valida el esquema y las migraciones contra un Postgres efimero,
      # exactamente como lo hace prod con `prisma migrate deploy`.
      - name: Aplicar migraciones (smoke test de DB)
        env:
          DATABASE_URL: postgresql://finanzas:finanzas@localhost:5432/finanzas_test
        run: npm run db:migrate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Cache de build de Next.js
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}

      - name: Build
        run: npm run build

      # Levanta el servidor de producción real y comprueba que responde,
      # que las cabeceras de seguridad llegan al cliente y que el bootstrap
      # de admin es atómico (dos registros simultáneos = un único ADMIN).
      # Todos los curl van acotados para no colgar el job si algo se tuerce.
      - name: Smoke test de servidor de producción
        env:
          AUTH_SECRET: ci-smoke-secret-1234567890123456
          DATABASE_URL: postgresql://finanzas:finanzas@localhost:5432/finanzas_test
        run: |
          fail() { echo "::error::$1"; echo "--- next-smoke.log ---"; cat /tmp/next-smoke.log 2>/dev/null || true; echo "------------------------"; [ -f /tmp/reg1.json ] && echo "reg1: $(cat /tmp/reg1.json | head -c 200)"; [ -f /tmp/reg2.json ] && echo "reg2: $(cat /tmp/reg2.json | head -c 200)"; kill $SERVER_PID 2>/dev/null || true; exit 1; }
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          npm start -- -p 3100 > /tmp/next-smoke.log 2>&1 &
          SERVER_PID=$!

          OK=0
          for i in $(seq 1 60); do
            if ! kill -0 $SERVER_PID 2>/dev/null; then echo "server murio durante el health check"; break; fi
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 4 http://localhost:3100/login || echo 000)
            if [ "$CODE" != "000" ]; then OK=1; break; fi
            sleep 1
          done
          [ "$OK" = "1" ] || fail "servidor no respondio /login (health ultimo code=$CODE)"
          echo "smoke: server up (login=$CODE)"

          HDRS=$(curl -sI --max-time 10 http://localhost:3100/login) || fail "no respondio HEAD en /login"
          echo "$HDRS" | grep -qi "content-security-policy:" || fail "FALTA Content-Security-Policy"
          echo "$HDRS" | grep -qi "x-content-type-options: nosniff" || fail "FALTA nosniff"
          echo "$HDRS" | grep -qi "x-frame-options: DENY" || fail "FALTA X-Frame-Options"
          echo "smoke: cabeceras de seguridad OK"

          # Bootstrap ADMIN: dos registros concurrentes sobre DB vacía. Con el
          # fix (aislamiento SERIALIZABLE + reintento) debe existir UN solo
          # ADMIN. Email duplicado debe responder 409.
          curl -s --max-time 20 -X POST http://localhost:3100/api/auth/register -H 'content-type: application/json' -d '{"email":"user1@example.com","password":"Password123","name":"Uno"}' -o /tmp/reg1.json &
          curl -s --max-time 20 -X POST http://localhost:3100/api/auth/register -H 'content-type: application/json' -d '{"email":"user2@example.com","password":"Password123","name":"Dos"}' -o /tmp/reg2.json &
          wait || fail "registros concurrentes fallaron (status no 0)"
          echo "smoke: registros concurrentes hechos"

          DUP=$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' -X POST http://localhost:3100/api/auth/register -H 'content-type: application/json' -d '{"email":"user1@example.com","password":"Password123"}')
          [ "$DUP" = "409" ] || fail "email duplicado respondio $DUP (esperaba 409)"
          echo "smoke: 409 en email duplicado OK"

          ADMINS=$(node -e "const{PrismaClient}=require(\"@prisma/client\");const p=new PrismaClient();p.user.count({where:{role:\"ADMIN\"}}).then(c=>{console.log(c);process.exit(c===1?0:1)}).catch(e=>{console.error(e);process.exit(2)})") || fail "no se pudo contar admins"
          [ "$ADMINS" = "1" ] || fail "Bootstrap roto: $ADMINS admins (esperaba 1)"
          echo "smoke: bootstrap OK — 1 único ADMIN con registros simultáneos"