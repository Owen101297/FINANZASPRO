name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Audit · Migraciones · Lint · Typecheck · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finanzas
          POSTGRES_PASSWORD: finanzas
          POSTGRES_DB: finanzas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finanzas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Las high del arbol de la CLI de Prisma (deepmerge-ts) estan
      # documentadas como riesgo aceptado; aqui se bloquea solo lo critico.
      - name: Auditoria de dependencias
        run: npm audit --audit-level=critical

      # Valida el esquema y las migraciones contra un Postgres efimero,
      # exactamente como lo hace prod con `prisma migrate deploy`.
      - name: Aplicar migraciones (smoke test de DB)
        env:
          DATABASE_URL: postgresql://finanzas:finanzas@localhost:5432/finanzas_test
        run: npm run db:migrate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Cache de build de Next.js
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}

      - name: Build
        run: npm run build

      # Levanta el servidor de producción real y comprueba que responde y que las
      # cabeceras de seguridad del middleware llegan al cliente. NO se inyecta
      # DATABASE_URL: las páginas son cliente puro y así el boot no depende de
      # la red interna de GH (el registro se valida aparte, en el paso de
      # integración, contra el Postgres efímero).
      - name: Smoke test de servidor de producción (páginas + cabeceras)
        env:
          AUTH_SECRET: ci-smoke-secret-1234567890123456
        run: |
          fail() { echo "::error::$1"; echo "--- next-smoke.log ---"; cat /tmp/next-smoke.log 2>/dev/null || true; kill $SERVER_PID 2>/dev/null || true; exit 1; }
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          npm start -- -p 3100 > /tmp/next-smoke.log 2>&1 &
          SERVER_PID=$!

          OK=0
          for i in $(seq 1 60); do
            if ! kill -0 $SERVER_PID 2>/dev/null; then echo "server murió durante el health check"; break; fi
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 4 http://localhost:3100/es/login) || CODE=000
            if [ -n "$CODE" ] && [ "$CODE" != "000" ]; then OK=1; break; fi
            sleep 1
          done
          [ "$OK" = "1" ] || fail "servidor no respondió /es/login (health último code=$CODE)"
          echo "smoke: server up (login=$CODE)"

          HDRS=$(curl -sI --max-time 10 http://localhost:3100/es/login) || fail "no respondió HEAD en /es/login"
          echo "$HDRS" | grep -qi "content-security-policy:" || fail "FALTA Content-Security-Policy"
          echo "$HDRS" | grep -qi "x-content-type-options: nosniff" || fail "FALTA nosniff"
          echo "$HDRS" | grep -qi "x-frame-options: DENY" || fail "FALTA X-Frame-Options"
          echo "$HDRS" | grep -qi "x-xss-protection: 0" || fail "FALTA X-XSS-Protection"
          echo "$HDRS" | grep -qi "cross-origin-resource-policy: same-origin" || fail "FALTA Cross-Origin-Resource-Policy"
          echo "$HDRS" | grep -qi "reporting-endpoints:" || fail "FALTA Reporting-Endpoints"
          echo "$HDRS" | grep -qi "report-to" || fail "FALTA report-to en CSP"
          echo "smoke OK: servidor de producción sirve /login con cabeceras de seguridad + CSP reporting"

      # Ejecuta el route handler real de /api/auth/register con NextRequest
      # contra el Postgres efímero y verifica el invariante del bootstrap: dos
      # registros simultáneos sobre base vacía => exactamente UN ADMIN, y el
      # email duplicado responde 409.
      - name: Test de integración del bootstrap de admin (race)
        env:
          DATABASE_URL: postgresql://finanzas:finanzas@localhost:5432/finanzas_test
        run: npx tsx scripts/ci-register-test.ts

      # Ejecuta los route handlers reales de recuperación de contraseña. Sin
      # SMTP configurado el mailer cae en modo log y permite validar el flujo
      # completo: token de un solo uso, anti-enumeración y auditoría.
      - name: Test de integración del reset de contraseña
        env:
          DATABASE_URL: postgresql://finanzas:finanzas@localhost:5432/finanzas_test
        run: npx tsx scripts/ci-reset-test.ts

      # Ejecuta los route handlers reales de transacciones y verifica que la
      # alerta de presupuesto (BUDGET_ALERT) se dispara solo al CRUZAR el 90%:
      # al crear, al editar (subir monto o pasar de ingreso a gasto) y nunca al
      # borrar, porque entonces el total solo baja.
      - name: Test de integración de la alerta de presupuesto (crear/editar/borrar)
        env:
          DATABASE_URL: postgresql://finanzas:finanzas@localhost:5432/finanzas_test
          AUTH_SECRET: ci-integration-secret-1234567890abcdef
        run: npx tsx scripts/ci-budget-test.ts

      # Test del endpoint de reporte de violaciones CSP (P12).
      # Valida que el handler acepta reports W3C y React, y devuelve 204.
      - name: Test del endpoint CSP report
        run: npx tsx scripts/ci-csp-report-test.ts

      # Ejecuta el route handler real POST /api/admin/data-cleanup y verifica
      # que la purga de P8 borra solo lo antiguo (audit_logs > 365 días, tokens
      # de reset usados/vencidos, devices inactivos > 180 días) y que un USER
      # recibe 403.
      - name: Test de integración de la purga de datos antiguos
        env:
          DATABASE_URL: postgresql://finanzas:finanzas@localhost:5432/finanzas_test
          AUTH_SECRET: ci-integration-secret-1234567890abcdef
        run: npx tsx scripts/ci-cleanup-test.ts

      # Tests unitarios con vitest (funciones puras: formato, ciclos, etc.)
      - name: Test unitarios (vitest)
        run: npm test

      # Tests E2E con Playwright (solo chromium para velocidad en CI)
      - name: Instalar Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Test E2E (Playwright)
        env:
          BASE_URL: http://localhost:3100
          AUTH_SECRET: ci-smoke-secret-1234567890123456
          DATABASE_URL: postgresql://finanzas:finanzas@localhost:5432/finanzas_test
        run: |
          npm start -- -p 3100 > /tmp/next-e2e.log 2>&1 &
          E2E_PID=$!
          trap 'kill $E2E_PID 2>/dev/null || true' EXIT

          for i in $(seq 1 60); do
            if ! kill -0 $E2E_PID 2>/dev/null; then echo "server died"; break; fi
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 4 http://localhost:3100/es/login) || CODE=000
            if [ -n "$CODE" ] && [ "$CODE" != "000" ]; then echo "server up (code=$CODE)"; break; fi
            sleep 1
          done

          npx playwright test --project=chromium