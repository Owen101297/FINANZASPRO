<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Generador de Iconos PWA</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #1c1c1e; color: white; text-align: center; padding: 40px; }
        canvas { border: 2px solid #333; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin: 20px; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; background: #007aff; color: white; border: none; border-radius: 12px; font-weight: bold; transition: transform 0.1s; }
        button:active { transform: scale(0.95); }
        p { color: #888; margin-bottom: 30px; }
    </style>
</head>
<body>
    <h1>Generador de Iconos FinanzasPro</h1>
    <p>Haz clic en el botón para descargar los iconos necesarios (192px y 512px).</p>
    
    <!-- Lienzo principal (512x512) -->
    <canvas id="canvas" width="512" height="512"></canvas>
    <br>
    <button onclick="downloadIcons()">⬇️ Descargar Iconos</button>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // 1. Configuración del Diseño (Estilo iOS Dark)
        const bgColor = "#000000";
        const textColor = "#007aff"; // Azul iOS
        const text = "FP"; // Iniciales

        // 2. Dibujar Fondo
        ctx.fillStyle = bgColor;
        ctx.fillRect(0, 0, 512, 512);

        // 3. Dibujar Texto Centrado
        ctx.fillStyle = textColor;
        ctx.font = "bold 280px -apple-system, system-ui, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        // Ajuste vertical ligero para centrado visual
        ctx.fillText(text, 256, 256 + 20); 

        // 4. Función de Descarga
        function downloadIcons() {
            // Descargar versión 512x512
            downloadCanvas(canvas, 'icon-512.png');

            // Crear versión 192x192 en memoria
            const canvas192 = document.createElement('canvas');
            canvas192.width = 192;
            canvas192.height = 192;
            const ctx192 = canvas192.getContext('2d');
            // Redimensionar
            ctx192.drawImage(canvas, 0, 0, 512, 512, 0, 0, 192, 192);
            
            // Descargar versión 192x192
            setTimeout(() => downloadCanvas(canvas192, 'icon-192.png'), 500);
        }

        function downloadCanvas(cvs, filename) {
            const link = document.createElement('a');
            link.download = filename;
            link.href = cvs.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
