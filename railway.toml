[build]
builder = "NIXPACKS"
buildCommand = "npx prisma generate && npx next build"

[deploy]
startCommand = "npx prisma db execute --file ./scripts/reset-db.sql --schema prisma/schema.prisma && npx prisma migrate deploy && npx next start -p $PORT"
healthcheckPath = "/login"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
